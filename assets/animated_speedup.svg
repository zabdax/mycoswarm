<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" font-family="monospace">
<rect x="0" y="0" width="420" height="230" fill="#fafafa"/>
<text x="210" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1B5E20">speedup vs undirected growth</text>
<rect x="60" y="40" width="330" height="52" fill="#E8F5E9"/>
<text x="395" y="58" text-anchor="end" font-size="10" fill="#2E7D32">10–50x band</text>
<line x1="60" y1="200" x2="390" y2="200" stroke="#333" stroke-width="2"/>
<line x1="60" y1="40" x2="60" y2="200" stroke="#333" stroke-width="2"/>
<line x1="60" y1="200" x2="390" y2="200" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/>
<text x="52" y="204" text-anchor="end" font-size="11">1x</text>
<rect x="110" y="200" width="70" height="0" fill="#42A5F5">
<animate attributeName="y" from="200" to="171" dur="1.2s" fill="freeze"/>
<animate attributeName="height" from="0" to="29" dur="1.2s" fill="freeze"/>
</rect>
<rect x="250" y="200" width="70" height="0" fill="#AB47BC">
<animate attributeName="y" from="200" to="129" dur="1.6s" fill="freeze"/>
<animate attributeName="height" from="0" to="71" dur="1.6s" fill="freeze"/>
</rect>
<text x="145" y="215" text-anchor="middle" font-size="11">edge ~12x</text>
<text x="285" y="215" text-anchor="middle" font-size="11">network ~27x</text>
<text x="145" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#0D47A1">11.5x
<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.2s" fill="freeze"/></text>
<text x="285" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#4A148C">27.1x
<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.6s" fill="freeze"/></text>
</svg>
